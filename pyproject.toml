
[project]
name = "movie-recommender"
version = "0.1.0"
description = "Content-based movie recommendation system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "pandas",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "scikit-learn",
    "scipy>=1.18.1",
    "streamlit",
]

[dependency-groups]
dev = [
    "ipykernel",
]
